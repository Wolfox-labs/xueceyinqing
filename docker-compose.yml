services:
  backend:
    build:
      context: .
      dockerfile: api_server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./runtime:/app/runtime
      - ./knowledge:/app/knowledge:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - xuece-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    networks:
      - xuece-network

networks:
  xuece-network:
    driver: bridge